<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17191e">
  <meta name="description" content="Wobblengine 2D game engine documentation">
  <title>Wobblengine Documentation</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #17191e;
      --panel: #1e2128;
      --panel-2: #242832;
      --border: #343945;
      --text: #e5e8ef;
      --muted: #a0a8b7;
      --accent: #80b8ff;
      --accent-bg: #253b55;
      --code: #111318;
      --sidebar-width: 290px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    a { color: var(--accent); }
    button, input { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 62px;
      padding: 10px 22px;
      background: rgba(23, 25, 30, .96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .brand {
      color: var(--text);
      font-weight: 700;
      font-size: 17px;
      text-decoration: none;
      white-space: nowrap;
    }

    .version {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .search {
      width: min(440px, 48vw);
      margin-left: auto;
      padding: 9px 12px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
    }

    .search:focus { border-color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      min-height: calc(100vh - 62px);
    }

    aside {
      position: sticky;
      top: 62px;
      align-self: start;
      height: calc(100vh - 62px);
      overflow-y: auto;
      padding: 20px 14px;
      background: var(--panel);
      border-right: 1px solid var(--border);
    }

    .nav-group { margin-bottom: 22px; }
    .nav-heading {
      margin: 0 10px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .nav-link {
      display: block;
      width: 100%;
      padding: 7px 10px;
      color: var(--muted);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .nav-link:hover { color: var(--text); background: var(--panel-2); }
    .nav-link.active { color: var(--accent); background: var(--accent-bg); }
    .nav-link.hidden { display: none; }
    .nav-group.empty { display: none; }

    main {
      width: min(100%, 1040px);
      padding: 46px clamp(22px, 6vw, 84px) 90px;
      overflow-wrap: anywhere;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 12px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.15;
      letter-spacing: -.03em;
    }

    h2 { margin-top: 34px; font-size: 22px; }
    h3 { margin-top: 24px; font-size: 17px; }
    p, li { color: #cbd0da; }
    li + li { margin-top: 6px; }

    .lead {
      max-width: 760px;
      color: var(--muted);
      font-size: 17px;
    }

    .callout {
      margin: 24px 0;
      padding: 14px 17px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 7px;
    }

    .callout p { margin: 0; }

    pre {
      max-width: 100%;
      padding: 17px;
      overflow-x: auto;
      color: #e4e9f2;
      background: var(--code);
      border: 1px solid var(--border);
      border-radius: 8px;
      line-height: 1.55;
    }

    code {
      padding: .12em .35em;
      color: #d9e8ff;
      background: var(--code);
      border-radius: 4px;
      font: .92em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    pre code { padding: 0; background: transparent; }

    .doc-footer {
      margin-top: 56px;
      padding-top: 18px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      .topbar { gap: 10px; padding: 10px 14px; }
      .version { display: none; }
      .search { width: 52vw; }
      .layout { display: block; }
      aside {
        position: static;
        width: 100%;
        height: auto;
        max-height: 250px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      main { padding-top: 30px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="#" id="homeLink">Wobblengine Docs</a>
    <span class="version">2D Engine · Python 3.11+</span>
    <input class="search" id="search" type="search" placeholder="Search documentation…" aria-label="Search documentation">
  </header>

  <div class="layout">
    <aside id="sidebar" aria-label="Documentation navigation"></aside>
    <main>
      <div id="content"></div>
      <footer class="doc-footer">
        Wobblengine documentation · Python 3.11+
      </footer>
    </main>
  </div>

  <script>
    const docs = {
      "Getting Started": [
        {
          title: "Overview",
          body: `
            <p class="lead">Wobblengine is a Python 2D game engine with a Unity-style editor, component-based GameObjects, a fixed-rate physics tick, and desktop and web build profiles.</p>
            <div class="callout"><p>The editor's game renderer uses pygame-ce's hardware-accelerated SDL2 renderer. Vulkan bindings are included as a dependency, but a Vulkan renderer is not implemented yet.</p></div>
            <h2>Project structure</h2>
            <p>Projects keep scenes, scripts, images, and settings under the project folder. Project settings are stored in <code>project/project.json</code>; scene files use JSON.</p>
            <h2>Default script</h2>
            <pre><code>from wobblengine import Wobblengine

class PlayerController(Wobblengine):
    # Called once before the first frame update.
    def Start(self):
        pass

    # Called once per rendered frame.
    def Update(self):
        pass

    # Called on the fixed 60 Hz tick.
    def OnTickUpdate(self):
        pass</code></pre>
          `
        },
        {
          title: "Editor shortcuts",
          body: `
            <h2>Scene and editing</h2>
            <ul>
              <li><code>Ctrl/Cmd + S</code> — save the scene</li>
              <li><code>Ctrl/Cmd + Z</code> — undo</li>
              <li><code>Ctrl/Cmd + Shift + Z</code> or <code>Ctrl/Cmd + Y</code> — redo</li>
              <li><code>Ctrl/Cmd + D</code> — duplicate the selected GameObject</li>
              <li><code>Delete</code> — delete the selected GameObject</li>
              <li><code>Ctrl/Cmd + N</code> — create a GameObject</li>
              <li><code>F</code> — focus the selected object in Scene</li>
              <li><code>W</code>, <code>E</code>, <code>R</code> — Move, Scale, Rotate</li>
              <li>Middle or right mouse drag — pan the Scene view</li>
              <li>Mouse wheel — zoom the Scene view</li>
            </ul>
            <h2>Project</h2>
            <ul>
              <li><code>Ctrl/Cmd + B</code> — build the game</li>
              <li><code>Ctrl/Cmd + P</code> — toggle Play mode</li>
              <li><code>Ctrl/Cmd + Shift + S</code> — save a named editor layout</li>
              <li><code>Ctrl/Cmd + Q</code> — exit the editor</li>
            </ul>
            <p>Shortcuts that edit the scene are ignored while a text field is being edited. Saving still works from a text field.</p>
          `
        }
      ],

      "Libraries": [
        {
          title: "pygame-ce",
          url: "https://pyga.me/docs/",
          body: `<p>Window creation, keyboard and mouse input, events, audio, and game runtime support. Wobblengine imports it as <code>pygame</code>.</p><pre><code>import pygame
events = pygame.event.get()
pressed = pygame.key.get_pressed()</code></pre>`
        },
        {
          title: "Vulkan",
          url: "https://github.com/realitix/vulkan",
          body: `<p>Python bindings for Vulkan. It is installed as a dependency, but the current game renderer uses pygame-ce SDL2 acceleration instead.</p>`
        },
        {
          title: "NumPy",
          url: "https://numpy.org/doc/stable/user/",
          body: `<p>Numerical arrays and vectorized operations for data and image processing.</p>`
        },
        {
          title: "Pillow",
          url: "https://pillow.readthedocs.io/en/stable/",
          body: `<p>Image loading and processing. Wobblengine uses Pillow for asset previews and sprite-atlas packing.</p>`
        },
        {
          title: "Pymunk",
          url: "https://www.pymunk.org/en/latest/",
          body: `<p>2D rigid-body physics library included as a dependency. The current Wobblengine collision system uses its own raycast-based physics implementation.</p>`
        },
        {
          title: "PyGLM",
          url: "https://github.com/recp/pyglm",
          body: `<p>Vector, matrix, and graphics math utilities in a Python interface to GLM.</p>`
        },
        {
          title: "Dear PyGui",
          url: "https://dearpygui.readthedocs.io/en/latest/",
          body: `<p>Immediate-mode GUI toolkit used for the editor, inspector, hierarchy, project browser, and documentation panel.</p>`
        },
        {
          title: "Pydantic",
          url: "https://docs.pydantic.dev/latest/",
          body: `<p>Data models and validation for project settings, scenes, GameObjects, components, and asset metadata.</p>`
        },
        {
          title: "orjson",
          url: "https://github.com/ijl/orjson",
          body: `<p>Fast JSON serialization and parsing for project, scene, and metadata files.</p>`
        },
        {
          title: "platformdirs",
          url: "https://platformdirs.readthedocs.io/en/latest/",
          body: `<p>Cross-platform locations for user settings, save data, and cache files.</p>`
        },
        {
          title: "watchdog",
          url: "https://python-watchdog.readthedocs.io/en/stable/",
          body: `<p>Filesystem event monitoring. It is available for future asset and script hot-reloading support.</p>`
        },
        {
          title: "pytest",
          url: "https://docs.pytest.org/en/stable/",
          body: `<p>Python test runner for engine and project tests.</p>`
        },
        {
          title: "noise",
          url: "https://github.com/caseman/noise",
          body: `<p>Perlin noise functions for procedural textures, terrain, and effects.</p>`
        },
        {
          title: "OpenSimplex",
          url: "https://github.com/lmas/opensimplex",
          body: `<p>OpenSimplex noise generation for procedural content.</p>`
        },
        {
          title: "PyInstaller",
          url: "https://pyinstaller.org/en/stable/",
          body: `<p>Packages Python desktop builds. Desktop builds must be produced on their target operating system.</p>`
        },
        {
          title: "pygbag",
          url: "https://pygame-web.github.io/wiki/pygbag/",
          body: `<p>Packages pygame-ce games for browsers through WebAssembly. Web runtime code must yield to the asyncio event loop.</p>`
        }
      ],

      "Rendering": [
        {
          title: "Renderer",
          body: `
            <p>The game runtime draws Sprite Renderer components through <code>GPU2DRenderer</code>, using pygame-ce's accelerated SDL2 renderer.</p>
            <p>Hardware acceleration is required; the renderer does not silently switch to software rendering. SDL selects the available native graphics driver, such as Metal, OpenGL, or Direct3D.</p>
            <p>The Scene editor uses Dear PyGui draw lists for object previews, collider outlines, and transform handles. Vulkan is not the active rendering backend.</p>
          `
        },
        {
          title: "GPU2DRenderer API",
          body: `
            <ul>
              <li><code>begin_frame(background)</code> — clear the frame.</li>
              <li><code>draw_sprite(sprite, center, size, rotation)</code> — draw a sprite texture.</li>
              <li><code>present()</code> — present the rendered frame.</li>
              <li><code>set_resolution((width, height))</code> — update the window and logical resolution.</li>
              <li><code>close()</code> — release renderer resources.</li>
            </ul>
            <p>An optional <code>atlas_rect</code> selects a region of a texture. Positive engine rotation is counter-clockwise.</p>
          `
        }
      ],

      "Wobblengine API": [
        {
          title: "GameObjects and components",
          body: `
            <p>A GameObject has an ID, name, Transform, components, optional parent, and optional script. Transform is always present and stores position, width, height, and 2D rotation.</p>
            <p>Components currently include Camera, Sprite Renderer, Rigidbody 2D, Box Collider 2D, Circle Collider 2D, and Polygon Collider 2D.</p>
            <pre><code>from wobblengine import BoxCollider2D, Rigidbody2D

body = game_object.get_component(Rigidbody2D)
collider = game_object.get_component(BoxCollider2D)</code></pre>
            <p>Transform cannot be removed. Camera and Sprite Renderer can be added or removed from the Inspector.</p>
          `
        },
        {
          title: "Script lifecycle",
          body: `
            <ol>
              <li><code>Awake()</code> — script instance created.</li>
              <li><code>OnEnable()</code> — script becomes active.</li>
              <li><code>Start()</code> — before the first rendered update.</li>
              <li><code>FixedUpdate()</code> and <code>OnTickUpdate()</code> — fixed 60 Hz tick.</li>
              <li><code>Update()</code> — once per rendered frame.</li>
              <li><code>LateUpdate()</code> — after frame updates.</li>
              <li><code>OnDisable()</code> and <code>OnDestroy()</code> — shutdown or deactivation.</li>
            </ol>
            <p>Legacy lowercase <code>start()</code> and <code>update()</code> methods are still called by <code>Start()</code> and <code>Update()</code>.</p>
          `
        },
        {
          title: "Fixed tick and threading",
          body: `
            <p>Desktop games run <code>FixedUpdate()</code> and <code>OnTickUpdate()</code> on an engine tick thread at a 60 Hz target. Web builds run the fixed tick coroutine on the same event-loop thread as rendering.</p>
            <p>Browser timing depends on event-loop scheduling. The web runtime sleeps between ticks and processes overdue tick deadlines after a delayed frame.</p>
            <pre><code>from wobblengine import FixedRateThread

worker = FixedRateThread(my_function, rate_hz=60)
worker.start()
worker.stop()</code></pre>
          `
        },
        {
          title: "2D physics",
          body: `
            <p>Physics runs on the fixed 60 Hz tick. Velocity is measured in world units per second; one Scene grid cell represents one unit.</p>
            <p>The physics system sweeps colliders across the velocity-times-timestep distance. When a raycast detects a hit, the object moves to the contact point on the next fixed tick. Inward velocity is removed so the body can slide.</p>
            <h3>Rigidbody 2D</h3>
            <ul>
              <li><code>linear_velocity</code> — X/Y velocity in units per second.</li>
              <li><code>linear_dampening</code> — reduce velocity over time.</li>
              <li><code>max_fall_speed</code> — maximum downward speed.</li>
              <li><code>gravity_scale</code> — scale the default gravity.</li>
            </ul>
            <p>Box, circle, and polygon colliders support offsets and rotation. Box size and circle radius can be edited in Scene. Polygon vertices can be dragged in Scene or edited in Inspector.</p>
            <pre><code>def OnCollisionEnter(self, collision):
    self.log(f"Hit {collision.game_object.name}")

def OnCollisionStay(self, collision):
    pass

def OnCollisionExit(self, collision):
    pass</code></pre>
            <p><code>Collision2D</code> exposes <code>game_object</code>, <code>collider</code>, <code>point</code>, <code>normal</code>, and <code>relative_velocity</code>. Trigger behavior is not implemented yet.</p>
          `
        },
        {
          title: "Camera",
          body: `
            <p>Camera fields are <code>camera_id</code> and <code>resolution</code>. Camera ID 0 is active by default.</p>
            <pre><code>self.set_active_camera(1)</code></pre>
            <p>Scripts can change the active ID at runtime. The runtime renders through the camera with the matching ID.</p>
          `
        },
        {
          title: "Sprite Renderer",
          body: `
            <p>Sprite Renderer draws an image using its GameObject Transform. Without an image, the editor can still show the GameObject as a colored shape.</p>
            <p>Project image assets can have sidecar import metadata for sprite mode, pixels per unit, mesh, filter, wrap, compression, maximum size, mipmaps, and alpha transparency.</p>
          `
        },
        {
          title: "Sprite atlases",
          body: `
            <p>Sprite Atlas metadata uses the <code>.spriteatlas.json</code> format. Settings include Master/Variant type, include in build, rotation, tight packing, padding, maximum size, Objects For Packing, filtering, compression, mipmaps, sRGB, read/write, and alpha dilation.</p>
            <p>Build Profiles collect project images into a shared <code>BuildAtlas.png</code> and assign atlas rectangles to Sprite Renderer components.</p>
          `
        },
        {
          title: "Build profiles",
          body: `
            <ul>
              <li><strong>Windows:</strong> .exe, built on Windows with PyInstaller.</li>
              <li><strong>macOS Universal:</strong> .dmg, requires Universal2 Python and Xcode command-line tools.</li>
              <li><strong>Web:</strong> HTML5/WebAssembly through pygbag.</li>
              <li><strong>Linux:</strong> desktop build through PyInstaller and the Linux toolchain.</li>
            </ul>
            <p>Python 3.11 or newer is required. Desktop builds are produced on their target operating system.</p>
          `
        }
      ]
    };

    const sidebar = document.getElementById("sidebar");
    const content = document.getElementById("content");
    const search = document.getElementById("search");
    let selected = { category: "Getting Started", title: "Overview" };

    function allEntries() {
      return Object.entries(docs).flatMap(([category, entries]) =>
        entries.map(entry => ({ category, ...entry }))
      );
    }

    function renderSidebar() {
      const query = search.value.trim().toLowerCase();
      sidebar.innerHTML = "";

      for (const [category, entries] of Object.entries(docs)) {
        const group = document.createElement("section");
        group.className = "nav-group";

        const heading = document.createElement("h2");
        heading.className = "nav-heading";
        heading.textContent = category;
        group.appendChild(heading);

        const matches = entries.filter(entry => {
          if (!query) return true;
          const text = `${category} ${entry.title} ${entry.body} ${entry.url || ""}`
            .replace(/<[^>]*>/g, " ")
            .toLowerCase();
          return text.includes(query);
        });

        for (const entry of matches) {
          const button = document.createElement("button");
          button.className = "nav-link";
          button.textContent = entry.title;
          button.classList.toggle("active",
            selected.category === category && selected.title === entry.title);
          button.addEventListener("click", () => {
            selected = { category, title: entry.title };
            renderSidebar();
            renderContent();
          });
          group.appendChild(button);
        }

        if (matches.length === 0) group.classList.add("empty");
        sidebar.appendChild(group);
      }
    }

    function renderContent() {
      const entry = docs[selected.category].find(item => item.title === selected.title);
      if (!entry) return;

      content.innerHTML = `
        <div class="eyebrow">${selected.category}</div>
        <h1>${entry.title}</h1>
        ${entry.body}
        ${entry.url ? `<p><a href="${entry.url}" target="_blank" rel="noopener noreferrer">Open official documentation ↗</a></p>` : ""}
      `;
    }

    search.addEventListener("input", renderSidebar);
    document.getElementById("homeLink").addEventListener("click", event => {
      event.preventDefault();
      selected = { category: "Getting Started", title: "Overview" };
      search.value = "";
      renderSidebar();
      renderContent();
    });

    renderSidebar();
    renderContent();
  </script>
</body>
</html>
