  <script>
    const articles = [
      { section: "Getting Started", title: "Overview", id: "overview", lead: "Build and run 2D games with Wobblengine, a Python game engine with a dockable editor and a separate game window.", body: `
        <h2 id="requirements">Requirements</h2><p>Wobblengine targets Python 3.11 or newer. Open the project folder in VS Code, create a virtual environment, and install the dependencies from <code>requirements.txt</code>.</p>
        <pre><code>python3 -m venv .venv
source .venv/bin/activate
pip install -r requirements.txt
python -m wobblengine</code></pre>
        <p>The editor creates a starter project and scene the first time it runs. Use the Play control to open the game in its separate runtime window.</p>
        <h2 id="editor-layout">Editor layout</h2><p>The editor includes Scene, Play, Hierarchy, Inspector, Project Files, Console, Terminal, and Project Settings panels. Panels can be moved and docked together as tabs. Save or load named layouts from <strong>Window → Layouts</strong>.</p>
        <h2 id="scripts">Scripts</h2><p>Game scripts are Python 3 files. Create one from Project Files with the context menu or the script action. New scripts inherit from <code>Wobblengine</code> and include lifecycle methods with explanatory comments.</p>
        <h2 id="current-renderer">Current renderer</h2><p>The runtime draws Sprite Renderer components using pygame-ce's accelerated SDL2 renderer. Vulkan is listed as a dependency for future rendering work; the current renderer does not use Vulkan.</p>` },
      { section: "Getting Started", title: "Script Lifecycle", id: "lifecycle", lead: "Wobblengine calls lifecycle hooks as a game object and its scripts are created, enabled, updated, and destroyed.", body: `
        <h2 id="order">Call order</h2><p>For enabled scripts, initialization runs in stages: all <code>Awake()</code> callbacks, then <code>OnEnable()</code>, then <code>Start()</code>. During play, the scheduler runs fixed-tick callbacks at 60 Hz and frame callbacks in execution-priority order. <code>LateUpdate()</code> follows <code>Update()</code> for scripts whose frame update ran.</p>
        <h2 id="callbacks">Available callbacks</h2><table><thead><tr><th>Method</th><th>When it runs</th></tr></thead><tbody><tr><td><code>Awake</code></td><td>Once when the script instance is created.</td></tr><tr><td><code>OnEnable</code></td><td>When the script becomes enabled.</td></tr><tr><td><code>Start</code></td><td>Once before the first update.</td></tr><tr><td><code>FixedUpdate</code></td><td>At the fixed 60 Hz simulation tick.</td></tr><tr><td><code>OnTickUpdate</code></td><td>At the same fixed 60 Hz tick.</td></tr><tr><td><code>Update</code></td><td>Once per rendered frame.</td></tr><tr><td><code>LateUpdate</code></td><td>After frame updates.</td></tr><tr><td><code>OnDisable</code></td><td>When the script is disabled or removed.</td></tr><tr><td><code>OnDestroy</code></td><td>When the game object is destroyed.</td></tr></tbody></table>
        <h2 id="template">Default script template</h2><pre><code>from wobblengine import Wobblengine

class NewScript(Wobblengine):
    def Start(self):
        # Called once before the first frame update.
        pass

    def Update(self):
        # Called once per rendered frame.
        pass

    def OnTickUpdate(self):
        # Called at the fixed 60 Hz simulation tick.
        pass</code></pre>
        <h2 id="instance-data">Script instance data</h2><p>Scripts can access their <code>game_object</code>, frame <code>delta_time</code>, <code>fixed_delta_time</code>, the <code>profiler</code>, shared <code>jobs</code> system, and pygame module through the base class. Helpers include <code>is_key_pressed(key)</code>, <code>log(message)</code>, and camera switching with <code>set_active_camera(camera_id)</code>.</p>` },
      { section: "Performance", title: "Profiler", id: "profiler", lead: "Measure script hooks, Python functions, and frame performance with the built-in profiler.", body: `
        <h2 id="enable-profiler">Enable the profiler</h2><p>The profiler is disabled by default. Enable it in the project's <code>project.json</code> under <code>performance</code>:</p><pre><code>"performance": {
  "profiler_enabled": true,
  "profile_functions": false,
  "history_size": 300,
  "slow_frame_ms": 16.67,
  "slow_script_ms": 2.0,
  "slow_function_ms": 1.0
}</code></pre><p>Older project files automatically use the default settings. Function profiling is separate because tracing every Python call adds more overhead.</p>
        <h2 id="profile-data">Read performance data</h2><p>Scripts can read the shared runtime profiler with <code>self.profiler</code>:</p><pre><code>for metric in self.profiler.snapshot():
    print(metric.name, metric.calls, metric.average_seconds, metric.maximum_seconds,
          metric.calls_per_second)

recent_frames = self.profiler.history()
slow_items = self.profiler.slow_entries()</code></pre><p>Metrics include script callback and frame execution times, total and average duration, maximum duration, and calls per second. Function-level entries are collected only when <code>profile_functions</code> is enabled. Frame history is bounded by <code>history_size</code>.</p>
        <h2 id="slow-thresholds">Slow thresholds</h2><p><code>slow_frame_ms</code>, <code>slow_script_ms</code>, and <code>slow_function_ms</code> set the millisecond thresholds used by <code>slow_entries()</code>. The profiler can also be used directly with <code>Profiler</code>, <code>PerformanceSettings</code>, and <code>PerformanceStatistics</code> imported from <code>wobblengine</code>.</p>` },
      { section: "Performance", title: "Script Scheduler", id: "script-scheduler", lead: "The central scheduler manages script lifecycle, enabled state, execution order, and optional update frequencies.", body: `
        <h2 id="scheduler-lifecycle">Lifecycle and enabled state</h2><p>The runtime registers each script once. It invokes lifecycle callbacks in Unity-style stages, runs callbacks only while a script is enabled, and sends <code>OnDisable()</code> followed by <code>OnDestroy()</code> when removing a live script. Callback failures are logged and retire the affected script.</p>
        <h2 id="scheduler-priority">Execution priority</h2><p>Lower <code>execution_priority</code> values run first. Set a priority or an update frequency from a script:</p><pre><code>class Logic(Wobblengine):
    def Start(self):
        self.set_execution_priority(10)
        self.set_update_frequency(30)       # 30 Update calls per second
        self.set_fixed_update_frequency(30) # 30 fixed callbacks per second</code></pre><p>Without a frequency setting, <code>Update()</code> runs once per rendered frame and fixed callbacks run on every 60 Hz simulation tick. <code>LateUpdate()</code> runs after that script's scheduled <code>Update()</code>.</p>
        <h2 id="scheduler-api">Scheduler API</h2><p><code>self.set_enabled(False)</code> stops callbacks and invokes <code>OnDisable()</code>. Re-enabling invokes <code>OnEnable()</code>; <code>Start()</code> still runs only once. <code>self.set_update_frequency(None)</code> restores per-frame updates, and <code>self.set_fixed_update_frequency(None)</code> restores every-tick fixed updates. <code>ScriptScheduler</code> is also exported by <code>wobblengine</code> for custom runtime integrations.</p>` },
      { section: "Performance", title: "Jobs", id: "jobs", lead: "Run independent work on desktop workers, join results through job handles, and express dependencies between jobs.", body: `
        <h2 id="submit-jobs">Submit jobs from a script</h2><p>Each running game script receives the shared job system as <code>self.jobs</code>. Desktop builds submit work to a reusable worker pool:</p><pre><code>def load_data():
    return [1, 2, 3]

def process_data(values):
    return [value * 2 for value in values]

def process_loaded_data():
    return process_data(load_job.result())

load_job = self.jobs.submit(load_data, name="Load data")
process_job = self.jobs.submit(process_loaded_data, depends_on=(load_job,), name="Process data")
if process_job.done:
    result = process_job.result()</code></pre><p>A dependent job starts only after its dependencies finish. If a dependency fails, the dependent job also fails and its function is skipped. <code>JobHandle.result()</code> returns the result or raises the job exception; <code>done</code>, <code>running</code>, <code>exception()</code>, and <code>cancel()</code> are also available. Because <code>result()</code> waits, check <code>done</code> before calling it from a frame callback.</p>
        <h2 id="job-management">Wait and shutdown</h2><p><code>self.jobs.complete_all(timeout=None)</code> waits for outstanding jobs and reports their errors. The runtime shuts its shared job system down when play mode stops. Standalone code can use <code>JobSystem(max_workers=...)</code> as a context manager and import <code>JobHandle</code> from <code>wobblengine</code>.</p>
        <h2 id="web-jobs">Web jobs</h2><p>Web builds execute jobs inline on the browser's game-loop thread. The job API and dependency behavior remain available, but jobs do not run in parallel in WebAssembly.</p>
        <div class="note"><strong>Thread safety</strong>Worker jobs should not call pygame rendering functions or mutate shared scene objects without synchronization.</div>` },
      { section: "Getting Started", title: "Editor Shortcuts", id: "shortcuts", lead: "Keyboard shortcuts for common editor actions.", body: `
        <h2 id="general">General</h2><table><thead><tr><th>Shortcut</th><th>Action</th></tr></thead><tbody><tr><td><code>Ctrl/Cmd + S</code></td><td>Save the current project or scene.</td></tr><tr><td><code>Ctrl/Cmd + Z</code></td><td>Undo the last supported editor action.</td></tr><tr><td><code>Ctrl/Cmd + Shift + Z</code></td><td>Redo an undone action.</td></tr><tr><td><code>Ctrl/Cmd + Q</code></td><td>Quit the editor.</td></tr></tbody></table>
        <h2 id="scene">Scene tools</h2><table><thead><tr><th>Shortcut</th><th>Tool</th></tr></thead><tbody><tr><td><code>W</code></td><td>Move</td></tr><tr><td><code>E</code></td><td>Scale</td></tr><tr><td><code>R</code></td><td>Rotate (2D Z axis)</td></tr><tr><td>Middle or right mouse drag</td><td>Pan the Scene view</td></tr><tr><td>Mouse wheel</td><td>Zoom the Scene view</td></tr></tbody></table><p>Shortcuts are ignored while a text field is being edited.</p>` },
      { section: "Editor", title: "Scene and Transforms", id: "scene-view", lead: "Select and edit GameObjects in the Scene view with familiar 2D move, rotate, and scale handles.", body: `
        <h2 id="selection">Selection and navigation</h2><p>Click a visible GameObject to select it. The selection remains available when interacting with empty space in the Scene view. Use the Hierarchy to select objects that have no visible sprite. Pan with the middle or right mouse button; use the wheel to zoom.</p>
        <h2 id="handles">Transform handles</h2><p>Choose Move, Rotate, or Scale from the Scene toolbar. Move handles drag along the world X and Y axes. Rotate uses the single 2D rotation axis (Z). Scale handles resize along the selected axis; use the center handle for uniform scaling when shown.</p>
        <h2 id="grid">Grid and units</h2><p>The Scene grid is the spatial reference for 2D objects. One world unit corresponds to one grid cell. Object transform values are editable in the Inspector and represented by the same handles in the Scene view.</p>
        <h2 id="hierarchy">Hierarchy</h2><p>GameObjects can be nested under parents. Click the disclosure arrow to collapse or expand children. Right-click in the Hierarchy to create, rename, duplicate, reparent, or delete GameObjects.</p>` },
      { section: "Editor", title: "Project Files", id: "project-files", lead: "Browse the project's real folders and files, preview images, and manage assets from the Project Files panel.", body: `
        <h2 id="folders">Folders and search</h2><p>Project Files follows the on-disk project folder structure. Click a folder to open it and use the search field to filter visible assets. Right-click a folder or empty space to create project folders and supported asset files.</p>
        <h2 id="previews">Image previews</h2><p>Recognized image assets use the image itself as the thumbnail. Select an image to view its preview and sprite import settings. Double-click a file to open it with the operating system's associated application.</p>
        <h2 id="metadata">Sprite import metadata</h2><p>Sprite settings are stored beside the image in a <code>.meta.json</code> file. Available settings include compression, Point/Bilinear/Trilinear filtering, pixels per unit, tiling, wrap mode, and related import options.</p>
        <h2 id="atlas">Sprite Atlases</h2><p>Create a Sprite Atlas from the Project Files context menu, add image assets to it, and configure packing options in the Inspector. Pack Atlas generates a PNG texture and stores sprite rectangles in the atlas metadata file. Build Profiles can also generate one combined build atlas.</p>` },
      { section: "Editor", title: "Layouts", id: "layouts", lead: "Arrange dockable editor panels and save named workspace layouts.", body: `
        <h2 id="docking">Move and dock panels</h2><p>Drag panel title bars to move them. Drop a panel over another panel to dock the two together as tabs. The top toolbar can also be moved and docked.</p>
        <h2 id="save-layout">Save a layout</h2><p>Choose <strong>Window → Layouts → Save</strong>, enter a name, and confirm. If that name already exists, the editor asks whether to replace the saved layout.</p>
        <h2 id="open-layout">Open a layout</h2><p>Choose <strong>Window → Layouts → Open</strong> and select a saved layout name. On startup, Wobblengine restores the default layout preset, including a custom layout when it has been made the default.</p>` },
      { section: "Runtime", title: "GameObjects and Components", id: "gameobjects", lead: "A scene is made of GameObjects, each with a Transform and optional behavior or rendering components.", body: `
        <h2 id="gameobject">GameObjects</h2><p>GameObjects are scene entities listed in the Hierarchy. Organize them using parent and child relationships. Scripts attached to a GameObject can read it as <code>self.game_object</code>.</p>
        <h2 id="transform">Transform</h2><p>Every GameObject has a Transform. It stores 2D position, Z-axis rotation, and scale. The Transform cannot be removed.</p>
        <h2 id="components">Built-in components</h2><table><thead><tr><th>Component</th><th>Purpose</th></tr></thead><tbody><tr><td>Camera</td><td>Defines a camera ID and output resolution. Camera ID 0 is active by default.</td></tr><tr><td>Sprite Renderer</td><td>Draws a sprite image, tint, and optional atlas region.</td></tr><tr><td>Rigidbody2D</td><td>Stores velocity, damping, gravity scale, and maximum fall speed.</td></tr><tr><td>Box Collider2D</td><td>Axis-aligned rectangular collision shape.</td></tr><tr><td>Circle Collider2D</td><td>Circular collision shape.</td></tr><tr><td>Polygon Collider2D</td><td>Polygonal collision shape with editable points.</td></tr></tbody></table>
        <h2 id="add-component">Add a component</h2><p>Select a GameObject and choose <strong>Add Component</strong> in the Inspector. Transform is always present; other components can be added or removed.</p>` },
      { section: "Runtime", title: "Camera", id: "camera", lead: "Cameras define the game view resolution and select which scene view is rendered during play.", body: `
        <h2 id="camera-fields">Camera settings</h2><p>Add a Camera component to a GameObject and set its resolution and Camera ID in the Inspector. Its view follows the GameObject's Transform.</p>
        <h2 id="active-camera">Active camera</h2><p>Camera ID <code>0</code> is active by default. A script can switch to another camera ID at runtime:</p><pre><code>self.set_active_camera(1)</code></pre><p>The Play window displays the currently active camera view.</p>` },
      { section: "Runtime", title: "Physics 2D", id: "physics-2d", lead: "Use 2D rigid bodies and colliders for fixed-step movement and collision callbacks.", body: `
        <h2 id="units">Units and speed</h2><p>One world unit maps to one Scene grid cell. Linear velocity is measured in units per second. Use <code>FixedUpdate</code> or <code>OnTickUpdate</code> for fixed-step physics behavior.</p>
        <h2 id="rigidbody">Rigidbody2D</h2><p>Rigidbody2D exposes Linear Velocity, Linear Dampening, Max Fall Speed, and Gravity Scale. Velocity is integrated over fixed ticks.</p>
        <h2 id="colliders">Collider shapes</h2><p>Wobblengine supports Box Collider2D, Circle Collider2D, and Polygon Collider2D. Polygon points can be adjusted in the Inspector and Scene view.</p>
        <h2 id="raycast">Collision checks</h2><p>Movement collision detection casts along the proposed movement direction. The ray length accounts for the body's speed over the tick. If a collider is hit, the body is moved to the hit point on the next tick and collision callbacks are dispatched.</p>
        <h2 id="callbacks">Collision callbacks</h2><p>Scripts can implement <code>OnCollisionEnter(collision)</code>, <code>OnCollisionStay(collision)</code>, and <code>OnCollisionExit(collision)</code>. Trigger volumes are not currently part of the collision API.</p>` },
      { section: "Runtime", title: "Tick System", id: "tick-system", lead: "The fixed tick is scheduled for 60 calls per second for deterministic gameplay timing.", body: `
        <h2 id="desktop">Desktop</h2><p>On desktop, the runtime runs <code>FixedUpdate()</code> and <code>OnTickUpdate()</code> on a dedicated tick thread at a 60 Hz target. Each tick uses a fixed delta time of 1/60 second.</p>
        <h2 id="web">Web builds</h2><p>WebAssembly builds run the tick on the same thread as the game loop because browsers do not support the desktop thread setup used by Wobblengine. The tick still targets 60 calls per second.</p>
        <h2 id="fixed-vs-frame">Fixed and frame updates</h2><p>Use fixed callbacks for physics and fixed-step simulation. Use <code>Update()</code> for frame-based behavior. The actual frame rate can vary independently of the fixed tick rate.</p>` },
      { section: "Rendering", title: "2D Renderer", id: "renderer", lead: "The current runtime uploads and draws Sprite Renderer textures through pygame-ce's accelerated SDL2 renderer.", body: `
        <h2 id="sprites">Sprites</h2><p>Sprite Renderer draws the selected image at the GameObject's Transform with an optional tint. Sprite Atlas builds store texture rectangles so a sprite can be drawn from the shared atlas texture.</p>
        <h2 id="gpu">GPU rendering</h2><p>Wobblengine uses pygame-ce's hardware-accelerated SDL2 rendering path for the game window. The editor Scene view currently uses Dear PyGui's drawing interface. Vulkan bindings are installed but a Vulkan renderer has not yet been implemented.</p>
        <h2 id="future">Rendering roadmap</h2><p>The renderer API is a foundation for later expansion. Current public project support is 2D.</p>` },
      { section: "Assets and Builds", title: "Sprite Import Settings", id: "sprite-import", lead: "Per-image metadata controls how sprite textures are sampled and prepared by the editor and build pipeline.", body: `
        <h2 id="settings-file">Metadata file</h2><p>Sprite import settings are saved next to the source image in a <code>.meta.json</code> sidecar file. This keeps import choices with the asset when the project is moved or versioned.</p>
        <h2 id="filtering">Filtering and compression</h2><p>Choose Point, Bilinear, or Trilinear filtering to control texture sampling. Compression settings are stored in metadata for the asset pipeline.</p>
        <h2 id="mapping">Pixels and texture mapping</h2><p>Pixels Per Unit controls how image pixels map to world units. Wrap and tiling settings control texture repetition and edge behavior. The Inspector exposes the available import options for the selected image.</p>` },
      { section: "Assets and Builds", title: "Sprite Atlas", id: "sprite-atlas", lead: "Pack multiple sprite assets into a shared texture and keep per-sprite rectangles in atlas metadata.", body: `
        <h2 id="create-atlas">Create and populate</h2><p>Right-click in Project Files and choose <strong>Create → Sprite Atlas</strong>. Select one or more image assets and use <strong>Add to Sprite Atlas</strong> to include them.</p>
        <h2 id="packing-options">Packing options</h2><p>Atlas metadata includes Master or Variant type, include in build, rotation, tight packing, padding, maximum texture size, packed objects, master-atlas reference, and variant scale. Texture settings include filtering, compression, mipmaps, sRGB, read/write access, and alpha dilation.</p>
        <h2 id="pack">Pack the atlas</h2><p>Choose <strong>Pack Atlas</strong> in the Inspector to produce a PNG atlas and persist each source sprite's rectangle in the <code>.spriteatlas.json</code> metadata. Variant atlases use a master atlas and a scale setting.</p>
        <h2 id="build-atlas">Build atlas</h2><p>Build Profiles generate a combined <code>BuildAtlas.png</code> for project images and assign its sprite rectangles to scene renderers in the staged build.</p>` },
      { section: "Assets and Builds", title: "Build Profiles", id: "build-profiles", lead: "Choose a target platform and output folder from Project Settings → Build Profiles.", body: `
        <h2 id="targets">Build targets</h2><table><thead><tr><th>Target</th><th>Output</th><th>Tooling</th></tr></thead><tbody><tr><td>Windows</td><td>Windows executable build</td><td>PyInstaller; Windows SDK/toolchain for native Windows builds</td></tr><tr><td>macOS Universal</td><td>Universal .dmg package</td><td>PyInstaller, Xcode Command Line Tools, Apple Clang, macOS SDK, Universal2 Python</td></tr><tr><td>Linux</td><td>Linux build</td><td>PyInstaller, GCC or Clang, binutils, glibc</td></tr><tr><td>Web</td><td>HTML5/WebAssembly package</td><td>pygbag; WebAssembly and Emscripten where required</td></tr></tbody></table>
        <h2 id="build-content">Build contents</h2><p>The build stages project files and assets, and generates a combined sprite atlas when image assets are present. Desktop packaging uses PyInstaller; web packaging uses pygbag. Python standard-library modules such as <code>pathlib</code>, <code>shutil</code>, <code>subprocess</code>, <code>json</code>, and <code>zipfile</code> support the build pipeline.</p>
        <h2 id="platform-limitations">Platform toolchains</h2><p>Desktop packages should be built with the target platform's compatible Python and toolchain. A macOS Universal build requires Universal2 Python and Apple's macOS build tools.</p>` },
      { section: "Reference", title: "Libraries", id: "libraries", lead: "Third-party packages and the role they have in Wobblengine.", body: `
        <h2 id="engine-libraries">Engine dependencies</h2><table><thead><tr><th>Library</th><th>Use</th></tr></thead><tbody><tr><td>pygame-ce</td><td>Game window, input, events, audio, and accelerated SDL2 rendering.</td></tr><tr><td>vulkan</td><td>Vulkan API bindings; available for future renderer development.</td></tr><tr><td>numpy</td><td>Numerical arrays and calculations.</td></tr><tr><td>Pillow</td><td>Image loading, processing, and atlas preparation.</td></tr><tr><td>pymunk</td><td>2D physics library dependency; Wobblengine's current collision implementation is documented under Physics 2D.</td></tr><tr><td>PyGLM</td><td>Vector, matrix, and graphics math.</td></tr><tr><td>Dear PyGui</td><td>Editor interface, panels, inspector, and tools.</td></tr><tr><td>Pydantic</td><td>Settings and data validation.</td></tr><tr><td>orjson</td><td>Fast JSON serialization and parsing.</td></tr><tr><td>platformdirs</td><td>Cross-platform settings, cache, and save locations.</td></tr><tr><td>watchdog</td><td>Asset file monitoring and hot-reload support.</td></tr><tr><td>noise / opensimplex</td><td>Procedural noise generation utilities.</td></tr><tr><td>pytest</td><td>Engine system tests.</td></tr></tbody></table>
        <h2 id="build-libraries">Build dependencies</h2><p>Desktop packaging uses PyInstaller. Web packaging uses pygbag. Native platform SDKs and compilers depend on the selected Build Profile. Python 3.11 or newer is required.</p>` },
      { section: "Reference", title: "Wobblengine API", id: "api", lead: "Core script base class, runtime properties, callbacks, and project systems authored for Wobblengine.", body: `
        <h2 id="base-class">Wobblengine script class</h2><p>Import <code>Wobblengine</code> as the base class for game scripts. The base exposes the owning GameObject, pygame access, delta-time values, input helpers, logging, and camera switching.</p>
        <h2 id="api-methods">Common methods and properties</h2><table><thead><tr><th>Member</th><th>Description</th></tr></thead><tbody><tr><td><code>is_key_pressed(key)</code></td><td>Returns whether a pygame key is held.</td></tr><tr><td><code>log(message)</code></td><td>Writes a message to the engine console.</td></tr><tr><td><code>set_active_camera(camera_id)</code></td><td>Switches the active camera by ID.</td></tr><tr><td><code>jobs</code></td><td>Shared <code>JobSystem</code> for background or inline work.</td></tr><tr><td><code>profiler</code></td><td>Runtime <code>Profiler</code> for snapshots, frame history, and slow entries.</td></tr><tr><td><code>set_enabled(bool)</code></td><td>Enables or disables this script and dispatches lifecycle callbacks.</td></tr><tr><td><code>set_execution_priority(int)</code></td><td>Sets callback order; lower values run first.</td></tr><tr><td><code>set_update_frequency(hz)</code></td><td>Sets optional frame-update frequency; <code>None</code> means every frame.</td></tr><tr><td><code>set_fixed_update_frequency(hz)</code></td><td>Sets optional fixed-update frequency; <code>None</code> means every tick.</td></tr><tr><td><code>OnTickUpdate()</code></td><td>Fixed callback with a 60 Hz target.</td></tr><tr><td><code>OnCollisionEnter(collision)</code></td><td>Called when contact begins.</td></tr><tr><td><code>OnCollisionStay(collision)</code></td><td>Called while contact continues.</td></tr><tr><td><code>OnCollisionExit(collision)</code></td><td>Called when contact ends.</td></tr></tbody></table>
        <h2 id="modules">Engine modules</h2><p>Engine source is in the <code>wobblengine/</code> package. Runtime script behavior is implemented in <code>script.py</code>, desktop and web loops in <code>play.py</code> and <code>web_play.py</code>, 2D collision data in <code>physics2d.py</code>, camera and sprite components in <code>camera.py</code>, and atlas packing in <code>sprite_atlas.py</code>.</p>` }
    ];

    const nav = document.getElementById('sidebar');
    const main = document.getElementById('mainContent');
    const toc = document.getElementById('toc');
    const search = document.getElementById('searchInput');
    let currentId = location.hash.slice(1) || 'overview';
    function plainText(article) { return (article.title + ' ' + article.lead + ' ' + article.body.replace(/<[^>]*>/g, ' ')).toLowerCase(); }
    function visibleArticles() {
      const term = search.value.trim().toLowerCase();
      return term ? articles.filter(a => plainText(a).includes(term)) : articles;
    }
    function renderNav() {
      const visible = visibleArticles();
      const groups = [...new Set(articles.map(a => a.section))];
      nav.innerHTML = '';
      if (!visible.length) { nav.innerHTML = '<div class="empty">No pages match your search.</div>'; return; }
      groups.forEach(section => {
        const pages = visible.filter(a => a.section === section);
        if (!pages.length) return;
        const label = document.createElement('div'); label.className = 'nav-label'; label.textContent = section; nav.append(label);
        pages.forEach(article => {
          const button = document.createElement('button'); button.className = 'nav-item' + (article.id === currentId ? ' active' : ''); button.textContent = article.title;
          button.onclick = () => { currentId = article.id; history.replaceState(null, '', '#' + article.id); renderNav(); renderArticle(); nav.classList.remove('open'); window.scrollTo(0, 0); };
          nav.append(button);
        });
      });
    }
    function renderArticle() {
      const article = articles.find(a => a.id === currentId) || articles[0]; currentId = article.id;
      main.innerHTML = `<div class="breadcrumbs">Documentation <span aria-hidden="true">/</span> ${article.section}</div><h1>${article.title}</h1><p class="lead">${article.lead}</p>${article.body}<div class="footer">Wobblengine Documentation · Version 0.1 · <a href="https://wobblengine.wobblabs.dev/">Return to Wobblengine</a></div>`;
      const headings = [...main.querySelectorAll('h2, h3')]; toc.innerHTML = '<div class="toc-title">On this page</div>';
      headings.forEach(h => { const link = document.createElement('a'); link.href = '#' + h.id; link.textContent = h.textContent; if (h.tagName === 'H3') link.className = 'sub'; toc.append(link); });
      document.title = article.title + ' | Wobblengine Documentation';
    }
    search.addEventListener('input', () => { renderNav(); if (search.value.trim()) { const first = visibleArticles()[0]; if (first && first.id !== currentId) { currentId = first.id; renderArticle(); } } });
    document.getElementById('menuButton').addEventListener('click', () => nav.classList.toggle('open'));
    window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (articles.some(a => a.id === id)) { currentId = id; renderNav(); renderArticle(); } });
    renderNav(); renderArticle();
  </script>
</body>
</html>
